    :root {
      --paper: #e7dece;
      --paper-light: #f2ebdf;
      --paper-deep: #d7c7b2;
      --ink: #211e18;
      --ink-soft: #6e6558;
      --ink-faint: #979083;
      --line: rgba(33, 30, 24, 0.18);
      --line-strong: rgba(33, 30, 24, 0.32);
      --rust: #a74b2c;
      --brass: #a88145;
      --forest: #2e4338;
      --sans: "Switzer", "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      --serif: "Centaur", "Book Antiqua", "Palatino Linotype", Palatino, Georgia, serif;
      --serif-italic: "Book Antiqua", "Palatino Linotype", Palatino, Georgia, serif;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-soft: cubic-bezier(0.33, 1, 0.68, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      background: var(--paper);
    }

    body {
      margin: 0;
      min-width: 300px;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(105% 80% at 72% 18%, #f5eee2 0%, rgba(245, 238, 226, 0) 55%),
        linear-gradient(145deg, var(--paper-light) 0%, var(--paper) 52%, #dfd2bf 100%);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 54% 42% at 70% 44%, rgba(255, 249, 237, 0.42) 0%, rgba(255, 249, 237, 0) 70%),
        linear-gradient(180deg, rgba(47, 37, 24, 0.02) 0%, rgba(47, 37, 24, 0.1) 100%);
    }

    ::selection {
      background: var(--rust);
      color: var(--paper-light);
    }

    button {
      font: inherit;
      color: inherit;
    }

    button:focus-visible {
      outline: 1px solid var(--rust);
      outline-offset: 5px;
    }

    .scene-shell {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: var(--paper);
    }

    #scene {
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1.5s var(--ease-soft) 0.18s;
      touch-action: none;
      cursor: default;
    }

    body.is-ready #scene {
      opacity: 1;
    }

    body.lever-hovered #scene {
      cursor: pointer;
    }

    #scene:focus-visible {
      outline: 1px solid rgba(167, 75, 44, 0.58);
      outline-offset: -4px;
    }

    .grain,
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .grain {
      z-index: 4;
      opacity: 0.12;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.52'/%3E%3C/svg%3E");
      background-size: 210px 210px;
    }

    .vignette {
      z-index: 2;
      background:
        radial-gradient(ellipse at 53% 48%, rgba(31, 23, 14, 0) 34%, rgba(51, 38, 22, 0.08) 73%, rgba(41, 30, 17, 0.22) 118%),
        linear-gradient(180deg, rgba(239, 231, 217, 0.06) 0%, rgba(67, 51, 31, 0.08) 100%);
      mix-blend-mode: multiply;
    }

    .ui {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: block;
      pointer-events: none;
    }

    .site-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      gap: 24px;
      padding: clamp(22px, 3.2vw, 42px) clamp(22px, 4.2vw, 64px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 34px;
    }

    .brand-mark {
      display: block;
      width: 31px;
      height: 31px;
      flex: 0 0 auto;
    }

    .brand-name {
      margin: 0;
      font-family: var(--sans);
      font-size: 9px;
      font-weight: 600;
      line-height: 1.45;
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    .brand-name span {
      display: block;
      color: var(--ink-soft);
      font-weight: 400;
      letter-spacing: 0.12em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: clamp(18px, 2.6vw, 38px);
      pointer-events: auto;
    }

    .specimen {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.16em;
      line-height: 1.5;
      text-align: right;
      text-transform: uppercase;
    }

    .specimen span {
      display: block;
      color: var(--ink-soft);
      font-weight: 400;
      letter-spacing: 0.11em;
    }

    .sound-toggle {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 6px 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: opacity 0.25s ease;
    }

    .sound-toggle:hover {
      opacity: 0.58;
    }

    .eq {
      display: flex;
      align-items: center;
      gap: 2px;
      width: 14px;
      height: 11px;
    }

    .eq i {
      display: block;
      width: 1.5px;
      height: 30%;
      background: currentColor;
      transform-origin: 50% 100%;
      animation: eq-dance 1.25s ease-in-out infinite;
      animation-play-state: paused;
    }

    .eq i:nth-child(2) {
      height: 80%;
      animation-delay: -0.3s;
    }

    .eq i:nth-child(3) {
      height: 52%;
      animation-delay: -0.7s;
    }

    .sound-toggle[aria-pressed="true"] .eq i {
      animation-play-state: running;
    }

    .sound-toggle[aria-pressed="false"] .eq i {
      height: 18%;
      animation: none;
      opacity: 0.55;
    }

    @keyframes eq-dance {
      0%,
      100% {
        transform: scaleY(0.58);
      }
      34% {
        transform: scaleY(1.15);
      }
      67% {
        transform: scaleY(0.35);
      }
    }

    .intro {

      left: clamp(22px, 5.4vw, 86px);

    .eyebrow {

      align-items: center;
      gap: 13px;

      color: var(--ink-soft);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.17em;
      line-height: 1.5;
      text-transform: uppercase;

    .title {

    .title-line {

    .title-line > span {

    .title-line:nth-child(2) > span {

    .title-line:nth-child(3) > span {

    .title em {

      font-style: italic;
      font-size: 0.94em;
      letter-spacing: -0.055em;
      transform: translateX(-0.02em);

    .intro-reveal {
      opacity: 0;
      transform: translate3d(0, 16px, 0);

        opacity 1s var(--ease-soft) 0.3s,
        transform 1.2s var(--ease-out) 0.3s;

      transition-delay: 0.18s;
    }

    .lede {
      margin: clamp(25px, 3.2vh, 38px) 0 0;
      color: var(--ink);

      font-size: clamp(13px, 0.95vw, 15px);
      font-weight: 400;
      line-height: 1.85;
      letter-spacing: 0.03em;
    }

    .lede-en {
      max-width: 330px;
      margin: 11px 0 0;
      color: var(--ink-soft);
      font-family: var(--serif-italic);
      font-size: clamp(13px, 1vw, 16px);
      font-style: italic;
      line-height: 1.45;
      letter-spacing: 0.005em;
    }

    .intro-rule {
      width: 38px;
      height: 1px;
      margin: 25px 0 0;
      background: var(--line-strong);

    .material-note {
      margin: 13px 0 0;

      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.13em;
      line-height: 1.75;
      text-transform: uppercase;
    }

    .readout {
      position: absolute;
      right: auto;
      bottom: clamp(72px, 8.2vh, 96px);
      left: clamp(22px, 5.4vw, 86px);
      display: grid;
      grid-template-columns: minmax(90px, 108px) minmax(0, 1fr);
      gap: 21px;
      width: min(26vw, 372px);
      padding: 17px 0 0;
      border-top: 1px solid var(--line-strong);
      pointer-events: none;
      opacity: 0;
      transform: translate3d(0, 16px, 0);
      transition:
        opacity 1s var(--ease-soft) 0.7s,
        transform 1.2s var(--ease-out) 0.7s;
    }

    body.is-ready .title-line > span {
      transform: translate3d(0, 0, 0);
    }

    body.is-ready .intro-reveal,
    body.is-ready .readout {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }

    .attempt-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 3px;
    }

    .field-label {
      display: block;
      color: var(--ink-soft);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.16em;
      line-height: 1.6;
      text-transform: uppercase;
    }

    .field-label small {
      display: block;
      color: var(--ink-faint);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.2em;
    }

    .attempt-number {
      display: flex;
      align-items: baseline;
      gap: 5px;
      margin-top: 1px;
      font-family: var(--serif);
      font-size: clamp(54px, 4.2vw, 66px);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: -0.055em;
      font-variant-numeric: tabular-nums;

    .attempt-number small {
      color: var(--ink-faint);
      font-family: var(--sans);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.1em;
    }

    .attempt-number.is-bumping {
      animation: number-bump 0.55s var(--ease-out);
    }

    @keyframes number-bump {
      0% {
        transform: translate3d(0, 0, 0);
      }
      35% {
        transform: translate3d(0, -7px, 0);
      }
      100% {
        transform: translate3d(0, 0, 0);
      }

    .readout-status {
      min-width: 0;
      min-height: 82px;
      padding-left: 20px;
      border-left: 1px solid var(--line);
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 0;
      padding-top: 3px;
      border-top: 0;
      color: var(--ink);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.13em;
      line-height: 1.5;
      text-transform: uppercase;
    }

    .status-dot {
      position: relative;
      width: 5px;
      height: 5px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--rust);
      box-shadow: 0 0 0 0 rgba(167, 75, 44, 0.28);
    }

    .status-dot::after {
      content: "";
      position: absolute;
      inset: -3px;
      border: 1px solid currentColor;
      border-radius: 50%;
      opacity: 0;
    }

    .readout[data-active="true"] .status-dot::after {
      animation: status-ping 1.7s ease-out infinite;
    }

    .readout[data-active="true"] .status-dot {
      background: var(--brass);
      color: var(--brass);
    }

    @keyframes status-ping {
      0% {
        opacity: 0.7;
        transform: scale(0.55);
      }
      80%,
      100% {
        opacity: 0;
        transform: scale(1.9);
      }
    }

    .status-note {
      min-height: 34px;
      margin: 8px 0 0;
      color: var(--ink-soft);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", var(--sans);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.7;
      letter-spacing: 0.015em;
      transition: opacity 0.3s ease;
    }

    .status-note.is-changing {
      opacity: 0;
    }

    .lever-tag {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px 11px 15px;
      border: 1px solid rgba(40, 32, 22, 0.22);
      border-radius: 999px;
      background: rgba(246, 239, 227, 0.82);
      color: var(--ink);
      box-shadow:
        0 14px 32px rgba(55, 41, 23, 0.11),
        inset 0 1px 0 rgba(255, 252, 245, 0.7);
      -webkit-backdrop-filter: blur(12px) saturate(1.1);
      backdrop-filter: blur(12px) saturate(1.1);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, calc(-100% - 38px)) scale(0.96);
      transition:
        opacity 0.45s var(--ease-soft),
        background 0.3s ease,
        color 0.3s ease,
        border-color 0.3s ease,
        transform 0.7s var(--ease-out);
      will-change: left, top, transform;
    }

    .lever-tag::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 100%;
      width: 1px;
      height: 31px;
      background: linear-gradient(180deg, rgba(43, 35, 24, 0.38), rgba(43, 35, 24, 0.06));
      transform: translateX(-50%);
      pointer-events: none;
    }

    .lever-tag::after {
      content: "";
      position: absolute;
      left: 50%;
      top: calc(100% + 31px);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--brass);
      box-shadow: 0 0 0 4px rgba(168, 129, 69, 0.13);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .lever-tag[data-visible="true"] {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, calc(-100% - 38px)) scale(1);
    }

    .lever-tag[data-visible="true"]:hover,
    .lever-tag[data-visible="true"]:focus-visible,
    body.lever-hovered .lever-tag[data-visible="true"] {
      border-color: rgba(40, 32, 22, 0.68);
      background: var(--ink);
      color: var(--paper-light);
      transform: translate(-50%, calc(-100% - 42px)) scale(1.015);
    }

    .lever-tag[data-visible="true"]:hover::before,
    .lever-tag[data-visible="true"]:focus-visible::before,
    body.lever-hovered .lever-tag[data-visible="true"]::before {
      background: linear-gradient(180deg, rgba(231, 222, 206, 0.7), rgba(231, 222, 206, 0.08));
    }

    .tag-copy {
      display: block;
      min-width: 79px;
      text-align: left;
    }

    .tag-cn {
      display: block;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.25;
      letter-spacing: 0.15em;

    .tag-en {

    }

    .tag-icon {
      display: grid;

      height: 23px;

      border-radius: 50%;

    .lever-tag:hover .tag-icon,
    .lever-tag:focus-visible .tag-icon,

      border-color: rgba(242, 235, 223, 0.35);

    }

    .tag-icon svg {
      width: 9px;
      height: 9px;
      overflow: visible;
    }

    .site-footer {
      position: absolute;
      right: clamp(22px, 4.2vw, 64px);

      left: clamp(22px, 5.4vw, 86px);

      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;
      color: rgba(33, 30, 24, 0.66);

      font-weight: 600;
      letter-spacing: 0.13em;
      line-height: 1.6;
      text-transform: uppercase;
      opacity: 0;

      opacity: 1;

    .footer-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .footer-rule {
      width: 29px;
      height: 1px;
      background: var(--line-strong);
    }

    .footer-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .footer-caption {
      color: rgba(33, 30, 24, 0.62);
      font-weight: 400;
      letter-spacing: 0.09em;
    }

    .edition {
      color: var(--ink);
    }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    .curtain {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      background: var(--paper);
      pointer-events: none;
      transition: opacity 0.9s var(--ease-soft) 0.1s;
    }

    body.is-ready .curtain {

    .curtain-mark {
      display: grid;
      place-items: center;
      gap: 15px;

    @keyframes curtain-in {

      .lever-tag::before {
        height: 19px;
      }

      .lever-tag::after {
        top: calc(100% + 19px);
      }

      .tag-cn {
        font-size: 11px;
      }

      .tag-en {
        font-size: 7px;
      }
    }

    @media (max-width: 380px) {
      .title {
        font-size: 43px;
      }

      .lede {
        max-width: 205px;
      }

      .readout {
        width: 156px;
      }

      .status-note {
        font-size: 9.5px;
      }

      .tag-copy {
        min-width: 67px;
      }
    }

    @media (min-width: 621px) and (max-width: 900px) {
      .readout {
        width: 238px;
        padding: 14px 16px 15px;
        border: 1px solid rgba(33, 30, 24, 0.16);
        border-top-color: var(--line-strong);
        border-radius: 3px;
        background: rgba(240, 232, 219, 0.72);
        box-shadow: 0 16px 38px rgba(54, 38, 20, 0.09);
        -webkit-backdrop-filter: blur(12px) saturate(1.05);
        backdrop-filter: blur(12px) saturate(1.05);
      }
    }

    @media (max-width: 620px) and (max-height: 750px) and (orientation: portrait) {
      .intro {
        top: 68px;
      }

      .title {
        font-size: clamp(44px, 14.5vw, 62px);
      }

      .lede {
        margin-top: 10px;
        font-size: 10.5px;
      }

      .site-footer {
        display: none;
      }

      .readout {
        right: 17px;
        bottom: 15px;
        left: 17px;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 16px;
        width: auto;
        padding-top: 9px;
      }

      .attempt-row {
        flex-direction: row;
        align-items: baseline;
        gap: 7px;
      }

      .field-label {
        font-size: 7px;
        letter-spacing: 0.11em;
      }

      .field-label small {
        display: none;
      }

      .attempt-number {
        margin: 0;
        font-size: 32px;
        line-height: 1;
      }

      .attempt-number small {
        font-size: 6px;
      }

      .readout-status {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 0;
        padding-left: 0;
        border-left: 0;
      }

      .status-row {
        margin: 0;
        padding: 0;
        border: 0;
        font-size: 7.5px;
      }

      .status-note {
        min-height: 0;
        margin: 3px 0 0;
        overflow: hidden;
        font-size: 9px;
        line-height: 1.35;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
    }

    @media (min-width: 901px) and (max-height: 860px) {
      .intro {
        top: clamp(128px, 18vh, 168px);
      }

      .lede {
        margin-top: 16px;
      }

      .lede-en,
      .intro-rule,
      .material-note {
        display: none;
      }

      .readout {
        bottom: 62px;
      }
    }

    @media (max-height: 690px) and (min-width: 901px) {
      .intro {
        top: clamp(108px, 17vh, 145px);
      }

      .title {
        font-size: clamp(58px, 6.4vw, 88px);
      }

      .lede {
        margin-top: 14px;
      }

      .readout {
        bottom: 54px;
      }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      .site-header {
        padding-top: 13px;
        padding-bottom: 13px;
      }

      .intro {
        top: 58px;
        left: 17px;
        width: 48vw;
      }

      .eyebrow {
        margin-bottom: 8px;
        font-size: 7px;
      }

      .title {
        font-size: clamp(34px, 6vw, 54px);
        line-height: 0.88;
      }

      .lede {
        margin-top: 10px;
        font-size: 9px;
        line-height: 1.55;
      }

      .lede-en,
      .intro-rule,
      .material-note {
        display: none;
      }

      .readout {
        right: 17px;
        bottom: 42px;
        width: 144px;
      }

      .attempt-number {
        font-size: 36px;
      }

      .status-note {
        font-size: 8.5px;
      }

      .site-footer {
        right: 17px;
        bottom: 9px;
        left: 17px;
      }

      .brand-name span,
      .footer-left {
        display: none;
      }

      .lever-tag {
        padding: 7px 10px;
      }

      .lever-tag::before,
      .lever-tag::after {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
      }

      .title-line > span,
      .intro-reveal,
      .readout,
      .site-footer,
      #scene,
      .curtain {
        transition-duration: 0.01ms !important;
        transition-delay: 0ms !important;
      }

      .eq i {
        animation: none;
      }

      .readout[data-active="true"] .status-dot::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="scene-shell">
    <canvas
      id="scene"
      role="button"
      tabindex="0"
      aria-label="拉动拉杆，启动无用机器"
    ></canvas>
  </div>

  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="ui">
    <header class="site-header">
      <div class="header-right">
        <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="true" aria-label="关闭声音">
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
          <span id="soundLabel">Sound on</span>
        </button>
      </div>
    </header>

    <section class="intro" aria-labelledby="pageTitle">
      <p class="eyebrow intro-reveal">Interactive automaton <span>交互装置 · étude 07</span></p>
      <h1 class="title" id="pageTitle">
        <span class="title-line"><span>The</span></span>
        <span class="title-line"><span><em>Useless</em></span></span>
        <span class="title-line"><span>Machine</span></span>
      </h1>
    </section>
  </main>

  <div class="curtain" id="curtain" aria-hidden="true"></div>

  <div class="webgl-error" id="webglError" role="alert">
    <p>
      <strong>A quiet machine.</strong>
      你的浏览器暂时无法启动 WebGL。请换一个现代浏览器，或开启硬件加速后再试。
    </p>
  </div>

  <noscript>
    <style>
      .curtain { display: none; }
    </style>
    <div class="webgl-error is-visible">
      <p><strong>A quiet machine.</strong> 这个装置需要 JavaScript 才能运转。</p>
    </div>
  </noscript>

  <script src="./vendor/three.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
